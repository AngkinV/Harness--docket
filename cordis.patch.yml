# Bundle patch for harness-docket.
#
# This is what makes the package a PROFILE LAYER rather than an inert
# dependency. When someone runs
#
#   dsh plugin --profile web add harness-docket
#
# DSH reconciles dsh.profile.bundles against installed packages: a dependency
# whose manifest declares `dsh.bundle.patch` (package.json) joins the layer
# stack and this insert row mounts the plugin. Without it the package installs
# and does nothing, emitting "declares no dsh.bundle" as a warning.
#
# The shape matches the shipped bundle patches (e.g. dsh-whale-widget).
- insert:
    - id: harness-docket
      name: harness-docket
